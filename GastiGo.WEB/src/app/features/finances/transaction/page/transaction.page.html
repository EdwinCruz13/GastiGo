<div class="container">
  <div class="toolbar-options">
    <div class="wrapper">
      <div class="form-group">
        <label class="form-label"> Tipo de Cuentas </label>
        <app-dropdown-select
          [items]="cuentas()"
          labelField="name"
          valueField="accountId"
          placeholder="Seleccione la cuenta"
          (valueChange)="onAccountChanged($event)"
          [selectedValue]="cuentaSeleccionada()?.accountId"
        >
        </app-dropdown-select>
      </div>

      <div class="header-toolbar">
        <app-card
          [data]="cuentaSeleccionada()"
          titleField="name"
          descriptionField="bank.abbre"
          badgeField="currency.symbol"
          metaField="description"
        ></app-card>

        <app-card
          [data]="balance()"
          title="Saldo Actual"
          descriptionField="balance"
          meta="Saldo Anterior"
          metaField="previousBalance"
          badgeField="currency"
          [isNumber]="true"
        ></app-card>
      </div>

      <div class="filter-toolbar">
        <div class="filter">
          <div class="form-group">
            <app-date-input
              label="Fecha Inicio"
              [value]="date1()"
              (valueChange)="onDate1Changed($event)"
            >
            </app-date-input>
          </div>

          <div class="form-group">
            <app-date-input
              label="Fecha Fin"
              [value]="date2()"
              (valueChange)="onDate2Changed($event)"
            >
            </app-date-input>
          </div>
        </div>

        <div class="options">
          <button class="btn btn-primary" (click)="addTransaction('IN')">
            <i class="fa-solid fa-plus"></i>
            Ingresar Ingreso
          </button>

          <button class="btn btn-danger" (click)="addTransaction('OUT')">
            <i class="fa-solid fa-minus"></i>
            Ingresar Gasto
          </button>

          <button class="btn btn-success" (click)="addTransaction('TRANSFER')">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            Transferencia en mis cuentas
          </button>

          @if (showEntryForm()) {
            <app-entry-form
              [EntryType]="tipoMov()"
              (close)="closeEntryForm()"
              (result)="closeEntryFormByResult(false)"
            >
            </app-entry-form>
          }

          @if (showTransferForm()) {
            <app-transfer-form [EntryType]="'TRANSFER'" (close)="showTransferForm.set(false)">
            </app-transfer-form>
          }
        </div>
      </div>
    </div>

    <div class="wrapper-details">
      <app-table [data]="transactiones()"> </app-table>
    </div>
  </div>

  <!--Modal de alerta-->
  <app-modal [open]="modalAlert()" (close)="modalAlert.set(false)">
    <div modal-header class="modal-header-pro">

      <div class="modal-title">
         <span>Mensaje</span>
      </div>
      <button (click)="modalAlert.set(false)" class="modal-close">
          <i class="fa-solid fa-xmark"></i>
      </button>

    </div>

    <div modal-body>
      {{ modalMessageText() }}
    </div>

    <div modal-footer>
      <button class="btn btn-danger" (click)="modalAlert.set(false)">Cerrar</button>
    </div>
  </app-modal>
</div>
